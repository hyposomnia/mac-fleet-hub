name: FleetHub
options:
  bundleIdPrefix: com.macfleet
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  FleetHub:
    type: application
    platform: iOS
    sources:
      - path: FleetHub
      - path: ../server/dashboard/titanium.json
        buildPhase: resources
    info:
      path: FleetHub/Info.plist
      properties:
        CFBundleDisplayName: Fleet Hub
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSCameraUsageDescription: 拍摄照片或视频作为所选 Mac 会话的附件。
        NSMicrophoneUsageDescription: 录制附件视频时采集声音。
        NSPhotoLibraryUsageDescription: 选择照片或视频作为所选 Mac 会话的附件。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macfleet.FleetHub
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
  FleetHubTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Swift]
    dependencies:
      - target: FleetHub
  FleetHubUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies:
      - target: FleetHub
schemes:
  FleetHub:
    build:
      targets:
        FleetHub: all
    test:
      targets: [FleetHubTests, FleetHubUITests]
