/* Full-area clock: one accessible tap target, two faces, shared date. */
.clock-panel{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 0 2.4cqw}
.clock-switch{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;flex:1;min-height:44px;border:0;border-radius:1.5cqw;padding:0;color:var(--text);gap:1.5cqw;cursor:pointer;background:none}
.clock-switch:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.clock-face{width:100%;height:24cqw;display:grid;place-items:center}
.digital-face{display:flex;flex-direction:row;align-items:baseline;justify-content:center;font-family:ui-rounded,"SF Pro Rounded",-apple-system,sans-serif;font-size:9.2cqw;line-height:1;font-weight:650;letter-spacing:-.065em;font-variant-numeric:tabular-nums;white-space:nowrap}.digital-colon{padding:0 .08em;color:var(--muted);font-weight:400}
.digital-minute{color:var(--accent)}
.analog-face{width:24cqw;height:24cqw;display:none;overflow:visible}
.clock-panel[data-mode="analog"] .digital-face{display:none}
.clock-panel[data-mode="analog"] .analog-face{display:block}
.clock-modes{display:flex;align-items:center;gap:1.3cqw;color:var(--muted);font-size:1.25cqw;font-weight:400;letter-spacing:.04em}
.clock-mode{padding:.45cqw .8cqw;border-radius:2cqw}
.clock-panel[data-mode="digital"] .mode-digital,.clock-panel[data-mode="analog"] .mode-analog{color:var(--text);background:var(--line)}
.clock-panel .date{font-size:1.5cqw;margin:1.1cqw 0 1.8cqw;text-align:center}
.clock-ring{fill:none;stroke:var(--line);stroke-width:1}
.clock-tick{stroke:var(--muted);stroke-width:1;stroke-linecap:round}
.clock-tick.major{stroke:var(--text);stroke-width:2.6}
.clock-number{fill:var(--muted);font-size:14px;font-family:-apple-system,sans-serif;text-anchor:middle;dominant-baseline:central}
.hour-hand{stroke:var(--text);stroke-width:6;stroke-linecap:round}
.minute-hand{stroke:var(--accent);stroke-width:4;stroke-linecap:round}


/* Standard slab-phone landscape: preserve two columns, size from available height. */
.screen[data-device="phone"]{aspect-ratio:19.5/9}
.screen[data-device="phone"] .layout{inset:6% 5.5%;grid-template-columns:minmax(0,1fr) 35%;gap:3cqw}

<header><h1>Fleet 待机 · 动态会话窗口</h1><div class="toolbar"><button id="device" aria-pressed="false">直板手机</button><button id="pause">暂停滚动</button><button id="theme">浅色预览</button></div></header>
<main class="frame"><section class="screen" aria-label="iPhone Duo 外屏待机设计稿"><div class="layout"><section class="main"><div class="label"><span class="live"></span><b>活动与未读</b><span>6</span></div><div class="viewport" tabindex="0" aria-label="活动与未读会话，触摸或聚焦暂停滚动"></div></section><aside class="side"><section class="clock-panel" data-mode="digital"><button class="clock-switch" type="button" aria-label="切换为模拟时钟"><span class="clock-face"><span class="digital-face" aria-hidden="true"><span class="digital-hour">21</span><span class="digital-colon">:</span><span class="digital-minute">41</span></span><svg class="analog-face" viewBox="0 0 240 240" aria-hidden="true"><circle class="clock-ring" cx="120" cy="120" r="112"/><g class="clock-ticks"></g><text class="clock-number" x="120" y="39">12</text><text class="clock-number" x="201" y="120">3</text><text class="clock-number" x="120" y="201">6</text><text class="clock-number" x="39" y="120">9</text><line class="hour-hand" x1="120" y1="128" x2="120" y2="64"/><line class="minute-hand" x1="120" y1="132" x2="120" y2="37"/><circle cx="120" cy="120" r="5" fill="var(--text)"/><circle cx="120" cy="120" r="2" fill="var(--bg)"/></svg></span></button><time class="date">10月17日 · 周六</time></section><section class="usage"><div class="usage-summary"><div class="label">今日模型用量</div><div class="total">1.28 M</div></div><div class="models" tabindex="0" aria-label="按模型查看今日用量"></div></section></aside></div></section></main>
<footer><span><span id="device-caption">Duo 外屏 2034 × 1398 · 比例 1.455:1</span><br>会话与模型逐行上滚、停留阅读；触摸、悬停或聚焦暂停，两区错峰切换。</span><span>概念原型 · 未连接真实会话或模型用量接口</span></footer>
<script>
const sessions=[['登录流程修复','MacBook Pro · Codex','待回应','已持续 12 分钟','wait'],['首页布局调整','Mac mini · Claude','进行中','已持续 8 分钟',''],['文件预览优化','MacBook Pro · Codex','未读','3 分钟前完成',''],['设备配对测试','Mac mini · Codex','进行中','已持续 24 分钟',''],['安装脚本检查','MacBook Air · Claude','未读','7 分钟前完成',''],['文档整理','MacBook Pro · Claude','进行中','已持续 5 分钟','']];
const view=document.querySelector('.viewport'),models=document.querySelector('.models');
view.innerHTML=sessions.map((s,index)=>{const type=s[2]==='进行中'?'spinner':s[2]==='未读'?'unread':'wait';return `<article class="session"><div class="session-heading"><h2 class="title">${s[0]}</h2><span class="indicator ${type}" role="img" aria-label="${s[2]}" title="${s[2]}">${type==='spinner'?Array.from({length:12},(_,i)=>`<i style="--i:${i}" aria-hidden="true"></i>`).join(''):''}</span></div><div class="session-details"><div class="meta"><span class="meta-part"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1ZM8 21h8M12 16v5"/></svg><span>${s[1].split(" · ")[0]}</span></span><span class="meta-part"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4H9l2 2h7.5A2.5 2.5 0 0 1 21 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5z"/></svg><span>${["fleet-hub","dashboard","file-preview","fleet-hub","installer","docs"][index]}</span></span></div><span class="age">${s[3]}</span></div></article>`}).join('');
models.innerHTML=[['GPT-5','640 K'],['Claude Sonnet','420 K'],['Claude Opus','220 K']].map(m=>`<div class="model"><div class="model-name">${m[0]}</div><div class="model-value">${m[1]}<small>tokens</small></div></div>`).join('');
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;const pause=document.querySelector('#pause');function label(){pause.textContent=paused?'继续滚动':'暂停滚动'}label();pause.onclick=()=>{paused=!paused;label()};document.querySelector('#theme').onclick=e=>{const light=document.querySelector('.screen').classList.toggle('light');e.target.textContent=light?'深色预览':'浅色预览'};
let last=performance.now(),elapsed=0,lastSlot=0;
function alignRowEnds(){
 for(const el of [view,models]){
  el._motion=(el._motion||0)+1;el._animating=false;
  el.querySelectorAll('[data-loop-copy]').forEach(row=>row.remove());
  el.style.paddingBottom='0px';el.scrollTop=0;
  const rows=[...el.children];el._cycleHeight=0;
  if(el.scrollHeight>el.clientHeight+1){
   for(const row of rows){const copy=row.cloneNode(true);copy.dataset.loopCopy='1';copy.setAttribute('aria-hidden','true');copy.inert=true;el.append(copy);}
   el._cycleHeight=el.children[rows.length].getBoundingClientRect().top-el.children[0].getBoundingClientRect().top;
  }
 }
}
new ResizeObserver(alignRowEnds).observe(document.querySelector('.screen'));alignRowEnds();
for(const el of [view,models]){
 el.addEventListener('pointerenter',()=>el.dataset.hold='1');
 el.addEventListener('pointerleave',()=>delete el.dataset.hold);
 el.addEventListener('touchstart',()=>el.dataset.hold='1',{passive:true});
 el.addEventListener('touchend',()=>setTimeout(()=>delete el.dataset.hold,6000),{passive:true});
 el.addEventListener('touchcancel',()=>delete el.dataset.hold,{passive:true});
}
function advanceRow(el){
 if(!el._cycleHeight||el._animating||el.dataset.hold||el.contains(document.activeElement))return;
 const top=el.getBoundingClientRect().top;
 const offsets=[...el.children].map(row=>row.getBoundingClientRect().top-top+el.scrollTop);
 const target=offsets.find(y=>y>el.scrollTop+2);
 if(target===undefined)return;
 const from=el.scrollTop,token=el._motion;let spent=0,previous=performance.now();
 el._animating=true;
 function frame(now){
  if(token!==el._motion)return;
  const dt=Math.min(now-previous,50);previous=now;
  if(!paused&&!document.hidden&&!el.dataset.hold&&!el.contains(document.activeElement))spent+=dt;
  const t=Math.min(spent/420,1),ease=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  el.scrollTop=from+(target-from)*ease;
  if(t<1){requestAnimationFrame(frame);return;}
  if(target>=el._cycleHeight-1)el.scrollTop=target-el._cycleHeight;
  el._animating=false;
 }
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.scrollTop=target>=el._cycleHeight-1?target-el._cycleHeight:target;el._animating=false;return;}
 requestAnimationFrame(frame);
}
function tick(now){
 const dt=Math.min(now-last,100);last=now;
 if(!paused&&!document.hidden){
  elapsed+=dt;
  const slot=Math.floor(elapsed/4000);
  if(slot!==lastSlot){lastSlot=slot;advanceRow(slot%2?view:models);}
 }
 requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const clockPanel=document.querySelector('.clock-panel'),clockSwitch=document.querySelector('.clock-switch');
document.querySelector('.clock-ticks').innerHTML=Array.from({length:60},(_,i)=>'<line class="clock-tick '+(i%5===0?'major':'')+'" x1="120" y1="14" x2="120" y2="'+(i%5===0?23:17)+'" transform="rotate('+(i*6)+' 120 120)"/>').join('');
let clockMode='digital';try{clockMode=localStorage.getItem('fleet-standby-clock')==='analog'?'analog':'digital'}catch{}
function setClockMode(mode){clockMode=mode;clockPanel.dataset.mode=mode;clockSwitch.setAttribute('aria-label',(mode==='digital'?'数字时钟，切换为模拟时钟':'模拟时钟，切换为数字时钟'));try{localStorage.setItem('fleet-standby-clock',mode)}catch{}}
clockSwitch.onclick=()=>setClockMode(clockMode==='digital'?'analog':'digital');setClockMode(clockMode);
function updateClock(){const now=new Date(),h=now.getHours(),m=now.getMinutes();document.querySelector('.digital-hour').textContent=String(h).padStart(2,'0');document.querySelector('.digital-minute').textContent=String(m).padStart(2,'0');document.querySelector('.hour-hand').setAttribute('transform','rotate('+((h%12)*30+m*.5)+' 120 120)');document.querySelector('.minute-hand').setAttribute('transform','rotate('+(m*6)+' 120 120)');const date=document.querySelector('.clock-panel .date');date.textContent=(now.getMonth()+1)+'月'+now.getDate()+'日 · '+['周日','周一','周二','周三','周四','周五','周六'][now.getDay()];date.dateTime=now.toISOString();clockSwitch.title=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+' · 点击切换钟面'}
updateClock();setInterval(updateClock,1000);

const screen=document.querySelector('.screen'),deviceButton=document.querySelector('#device');
function setDevice(phone){
 screen.dataset.device=phone?'phone':'duo';
 screen.setAttribute('aria-label',phone?'直板手机横屏待机设计稿':'iPhone Duo 外屏待机设计稿');
 deviceButton.textContent=phone?'切回 Duo':'直板手机';deviceButton.setAttribute('aria-pressed',String(phone));
 document.querySelector('#device-caption').textContent=phone?'直板手机横屏 · 19.5:9 参考画布':'Duo 外屏 2034 × 1398 · 比例 1.455:1';
 requestAnimationFrame(alignRowEnds);
}
deviceButton.onclick=()=>setDevice(screen.dataset.device!=='phone');
setDevice(new URLSearchParams(location.search).get('device')==='phone');
</script></html>
