<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><link rel="stylesheet" href="../../../server/dashboard/style.css"><title>简洁大脑 · 已接入组件</title><style>
html,body{height:auto;min-height:100%;overflow:auto}body{padding:32px}main{width:min(620px,100%);margin:auto}h1{font-size:20px;margin-bottom:12px}p{color:var(--text-2);font-size:13px}nav{display:flex;gap:8px;margin:24px 0}nav button{padding:0 14px;min-height:44px;background:var(--surface-2);border-radius:12px}nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}#win{display:flex;position:static;background:var(--surface-2);padding:20px;border-radius:16px;min-height:150px;justify-content:space-between;align-items:flex-start}#caption{font-size:13px;color:var(--text-2)}#chat-options-trigger{pointer-events:none}
</style></head><body><main><h1>简洁大脑 · 模型选择</h1><p>使用当前 Dashboard 的真实 SVG、按钮标记与样式。</p><nav><button id="theme" type="button">深色</button><button id="mode" type="button">文件模式</button></nav><section id="win" data-workspace-preview="false"><span id="caption">输入消息…</span><button id="chat-options-trigger" type="button" class="chat-options-trigger" title="模型选项" aria-label="模型选项" aria-disabled="true">
                      <svg class="ic" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.2C12 3.65 10.8 2.7 9.4 2.7c-1.6 0-2.8 1.25-2.8 2.8v.35C4.8 6.2 3.7 7.6 3.7 9.3c0 .7.2 1.35.55 1.9-1.1.7-1.75 1.85-1.75 3.2 0 1.8 1.15 3.3 2.8 3.8v.35c0 1.55 1.3 2.75 2.9 2.75 2.1 0 3.8-1.7 3.8-3.8V5.2Z"/><path d="M12 5.2C12 3.65 13.2 2.7 14.6 2.7c1.6 0 2.8 1.25 2.8 2.8v.35c1.8.35 2.9 1.75 2.9 3.45 0 .7-.2 1.35-.55 1.9 1.1.7 1.75 1.85 1.75 3.2 0 1.8-1.15 3.3-2.8 3.8v.35c0 1.55-1.3 2.75-2.9 2.75-2.1 0-3.8-1.7-3.8-3.8"/><path d="M6.6 5.85c0 1.6.8 2.65 2.25 2.9M4.25 11.2c.85 1 2.1 1.5 3.3 1.2M8 16.2c.8-.8 2.4-1 4 .05M17.4 5.85c0 1.6-.8 2.65-2.25 2.9M19.75 11.2c-.85 1-2.1 1.5-3.3 1.2M16 16.2c-.8-.8-2.4-1-4 .05"/></svg>
                      <span id="chat-options-model">6 Astra</span>
                      <span id="chat-options-effort" class="chat-options-secondary">极高</span>
                      <svg class="chat-options-chevron" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
                    </button></section><p id="status">会话模式 · 15px</p></main><script>document.querySelector('#theme').onclick=function(){const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';this.textContent=dark?'浅色':'深色'};document.querySelector('#mode').onclick=function(){const compact=document.querySelector('#win').dataset.workspacePreview!=='true';document.querySelector('#win').dataset.workspacePreview=String(compact);this.textContent=compact?'会话模式':'文件模式';document.querySelector('#status').textContent=compact?'文件模式 · 18px':'会话模式 · 15px'};</script></body></html>
