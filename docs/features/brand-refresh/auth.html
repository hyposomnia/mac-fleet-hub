<!doctype html><html lang="zh-CN" class="account-root" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fleet · 登录配色预览</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="account-base.css"><link rel="stylesheet" href="tokens.css"><style>.account-brand{display:flex;align-items:center;gap:8px}.account-brand img{width:30px;height:30px}.account-button{min-height:44px}.account-content{margin-top:10vh}.account-header nav a{min-height:44px;display:inline-flex;align-items:center}#auth-demo-message{color:var(--accent-text);margin-top:20px}</style></head><body class="account-page account-auth"><header class="account-header"><a href="index.html" class="account-brand"><img src="assets/logo-mark-dark.svg" alt="">fleet hub</a><nav class="account-links"><a href="index.html">设计规范</a><button id="auth-theme" class="account-button" type="button">切换深色</button></nav></header><main class="account-content"><h1>登录</h1><p class="account-muted">继续访问你的设备与会话。</p><form class="account-form" id="auth-demo"><label>用户名<input name="username" autocomplete="username" required></label><label>密码<input type="password" name="password" autocomplete="current-password" required></label><button class="account-button primary" type="submit">继续</button></form><p class="account-muted">仅用于设计预览。请勿输入真实凭据。</p><p id="auth-demo-message" role="status"></p></main><script>document.getElementById('auth-theme').onclick=function(){const light=document.documentElement.dataset.theme==='light';document.documentElement.dataset.theme=light?'dark':'light';this.textContent=light?'切换浅色':'切换深色';document.querySelector('.account-brand img').src=light?'assets/logo-mark-light.svg':'assets/logo-mark-dark.svg'};document.getElementById('auth-demo').onsubmit=function(e){e.preventDefault();this.reset();document.getElementById('auth-demo-message').textContent='已展示提交反馈。设计预览不进行登录。'};</script></body></html>
