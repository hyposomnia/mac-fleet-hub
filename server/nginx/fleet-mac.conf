    # ---- Mac__N__ ----
    location ^~ /m__N__/term/ {
        auth_request /authz;
        proxy_pass http://__MAC_IP__:__TTYD_PORT__/m__N__/term/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fleet_conn_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    location ^~ /m__N__/files/ {
        auth_request /authz;
        proxy_pass http://__MAC_IP__:__FB_PORT__/m__N__/files/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fleet_conn_upgrade;
        proxy_set_header Host $host;
        # filebrowser 上传也走这条反代，别被 http 级 8m 默认限制挡住。
        client_max_body_size 513m;
        proxy_read_timeout 86400s;
    }
    # DSH Desktop 原生 Web UI。浏览器仍只访问 Fleet 同域路径；fleet-agent 在 Mac
    # 内部把请求转给 loopback Harness，并持有上游 cookie，绝不把 DSH token 暴露公网。
    location = /m__N__/dsh {
        auth_request /authz;
        # $http_host preserves a public NAT port such as :20443. A bare
        # relative redirect would be expanded with nginx's internal :443.
        return 308 $scheme://$http_host/m__N__/dsh/;
    }
    location ^~ /m__N__/dsh/ {
        auth_request /authz;
        proxy_pass http://__MAC_IP__:__AGENT_PORT__/api/dsh-native/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fleet_conn_upgrade;
        proxy_set_header Host $host;
        client_max_body_size 513m;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    location ^~ /m__N__/api/ {
        auth_request /authz;
        proxy_pass http://__MAC_IP__:__AGENT_PORT__/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # fleet-agent accepts 512 MiB files plus multipart overhead.
        client_max_body_size 513m;
        # This location includes chat SSE; preserve upstream Flush calls.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
