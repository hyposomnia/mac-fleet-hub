server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __FLEET_HOST__;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;

    location = /enroll/confirm {
        proxy_pass http://127.0.0.1:7090;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /enroll/confirm/ {
        proxy_pass http://127.0.0.1:7090;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /enroll/agent-config {
        proxy_pass http://127.0.0.1:7090;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /enroll/join {
        proxy_pass http://127.0.0.1:7090;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ^~ /enroll/ {
        alias /var/www/fleet-enroll/;
        autoindex off;
        default_type application/octet-stream;
        types {
            application/gzip gz;
            text/plain sh;
        }
    }

    location / {
        proxy_pass http://127.0.0.1:7090;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fleet_conn_upgrade;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 513m;
    }
}
